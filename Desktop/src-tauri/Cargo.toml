[package]
name = "filemaker-script-bridge-desktop"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde_json = "=1.0.150"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "=0.10.9"
fs2 = "=0.4.3"
tokio = { version = "=1.53.3", features = ["rt", "time"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString", "NSArray"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# Model verification must remain practical even in development builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
